name: Cloud browser journey and defect detection

on:
  pull_request:
    paths:
      - '.agents/skills/game-test-player/adapters/browser/**'
      - '.agents/skills/game-test-player/fixtures/browser-journey/**'
      - '.agents/skills/game-test-player/scripts/*browser*'
      - '.agents/skills/game-test-player/scripts/session.py'
      - '.agents/skills/game-test-player/requirements-browser.txt'
      - '.github/workflows/browser-journey-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional browser dependencies
        run: |
          python -m pip install -r .agents/skills/game-test-player/requirements-browser.txt
          python -m playwright install --with-deps chromium --only-shell
      - name: Preserve existing recorder contract
        run: python .agents/skills/game-test-player/scripts/self_check.py
      - name: Full journey and eight injected defects
        run: python .agents/skills/game-test-player/scripts/self_check_browser.py --out evidence/browser-ci
      - name: Keep success and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-journey-evidence
          path: evidence/browser-ci/
          if-no-files-found: warn
          retention-days: 7
